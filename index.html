<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arpitha Singh | Resume</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
        }

        .container{
            background:#fff;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:400px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .profile-icon{
            width:100px;
            height:100px;
            margin:auto;
            border-radius:50%;
            background:#eef2ff;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            color:#4f46e5;
            font-weight:bold;
        }

        h1{
            margin-top:20px;
            color:#222;
        }

        p{
            margin:10px 0 25px;
            color:#666;
            font-size:16px;
        }

        .resume-btn{
            display:inline-block;
            text-decoration:none;
            background:#4f46e5;
            color:white;
            padding:14px 30px;
            border-radius:10px;
            font-weight:600;
            transition:0.3s;
        }

        .resume-btn:hover{
            background:#3730a3;
            transform:translateY(-3px);
        }

        .footer{
            margin-top:25px;
            color:#888;
            font-size:14px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="profile-icon">
            AS
        </div>

        <h1>Arpitha Singh</h1>

        <p>AI/ML Engineer | Data Analyst</p>

        <a href="Resume (6).pdf" target="_blank" class="resume-btn">
            📄 View Resume
        </a>

        <div class="footer">
            Hyderabad, Telangana
        </div>

    </div>

</body>
</html>
